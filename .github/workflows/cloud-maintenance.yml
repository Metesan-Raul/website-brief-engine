name: Weekly project check
on:
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-project-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run tests
        run: npm test
      - name: Check usage example
        run: npm run example
      - name: Write result summary
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
          NODE_VERSION: ${{ matrix.node }}
        run: |
          printf '## Weekly project check\n\nNode: %s\n\nResult: %s\n\nThis is a maintenance check, not a new code contribution or a LinkedIn publication.\n' "$NODE_VERSION" "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
